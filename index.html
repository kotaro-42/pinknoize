<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="White Noise">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>White Noise</title>
</head>
<body>
    <noscript>このアプリを利用するには JavaScript を有効にしてください。</noscript>
    <main class="app" id="app">
        <h1 class="app-title">White Noise</h1>
        <p class="offline-hint" id="offline-hint">起動中…（v11）</p>
        <p class="app-hint" id="status-hint">再生するには「再生」をタップしてください</p>
        <button type="button" class="play-button" id="play-toggle" aria-pressed="false">
            <span class="play-button-label" id="play-label">再生</span>
        </button>
        <section class="volume-block">
            <label class="volume-label" for="volume-slider">音量</label>
            <input
                type="range"
                id="volume-slider"
                class="volume-slider"
                min="0"
                max="100"
                value="50"
                step="1"
            >
            <p class="volume-readout" id="volume-readout">50%</p>
        </section>
        <p class="load-error" id="load-error" hidden role="alert"></p>
    </main>

    <!-- 旧 RNBO 版の SW/キャッシュを一度外してから本体を読み込む -->
    <script>
    (function () {
        var APP_VERSION = "11";
        function loadApp() {
            var s = document.createElement("script");
            s.src = "js/app.js?v=" + APP_VERSION;
            s.onerror = function () {
                var el = document.getElementById("load-error");
                if (el) {
                    el.hidden = false;
                    el.textContent =
                        "スクリプトを読み込めませんでした。通信を確認してページを更新してください。";
                }
            };
            document.body.appendChild(s);
        }
        function purgeThenLoad() {
            var pending = 0;
            function done() {
                pending--;
                if (pending <= 0) {
                    loadApp();
                }
            }
            pending = 1;
            if ("serviceWorker" in navigator) {
                pending++;
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    var i;
                    for (i = 0; i < regs.length; i++) {
                        regs[i].unregister();
                    }
                    done();
                }, done);
            }
            if (window.caches && caches.keys) {
                pending++;
                caches.keys().then(function (keys) {
                    var j;
                    for (j = 0; j < keys.length; j++) {
                        if (keys[j].indexOf("pink-noise") === 0) {
                            caches.delete(keys[j]);
                        }
                    }
                    done();
                }, done);
            }
            done();
        }
        purgeThenLoad();
    })();
    </script>
</body>
</html>
