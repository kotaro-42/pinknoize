<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pink Noise">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Pink Noise</title>
</head>
<body>
    <noscript>このアプリを利用するには JavaScript を有効にしてください。</noscript>
    <main class="app" id="app">
        <h1 class="app-title">Pink Noise</h1>
        <p class="offline-hint" id="offline-hint">オフライン準備: 未完了</p>
        <p class="app-hint" id="status-hint">再生するには「再生」をタップしてください</p>
        <button type="button" class="play-button" id="play-toggle" aria-pressed="false" disabled>
            <span class="play-button-label" id="play-label">再生</span>
        </button>
        <section class="volume-block">
            <label class="volume-label" for="volume-slider">音量</label>
            <input
                type="range"
                id="volume-slider"
                class="volume-slider"
                min="0"
                max="100"
                value="50"
                step="1"
            >
            <p class="volume-readout" id="volume-readout">50%</p>
        </section>
        <p class="load-error" id="load-error" hidden role="alert"></p>
    </main>

    <script src="js/rnbo.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
